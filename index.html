<!DOCTYPE html>
<meta charset="utf-8">
<style>
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  width: 960px;
  height: 500px;
  position: relative;
}

svg {
	width: 100%;
	height: 100%;
}

path.slice{
	stroke-width:2px;
}

polyline{
	opacity: .3;
	stroke: black;
	stroke-width: 2px;
	fill: none;
}

</style>
<body>
<h2> Pie slice labels lines</h2>
<form>
<input type="button" value="start" id="btn">
</form>
<script src="http://d3js.org/d3.v3.min.js"></script>
<script>

		var dataset = [
		
			{legend:"apple", value:10, color:"red",values:40,value3:9},
			{legend:"orange", value:45, color:"orange",values:5,value3:5},
			{legend:"banana", value:25, color:"yellow",values:30,value3:10},
			{legend:"peach", value:70, color:"pink",values:17,value3:7},
			{legend:"grape", value:20, color:"purple",values:19,value3:4}
		
			];


var svg = d3.select("body")
	.append("svg")
	.append("g");

//  append(g) 
svg.append("g")
	.attr("class", "slices");
svg.append("g")
	.attr("class", "labels");
svg.append("g")
	.attr("class", "lines");

var width = 700,
    height = 500,
  	radius = Math.min(width, height) / 2
  	pi=Math.PI;
   



var arc = d3.svg.arc()
	.outerRadius(radius * 0.8)
	.innerRadius(radius * 0.4);

var midArc = d3.svg.arc()
	.innerRadius(radius * 0.8)
	.outerRadius(radius * 0.8);	

var outerArc = d3.svg.arc()
	.innerRadius(radius * 0.9)
	.outerRadius(radius * 0.9);

svg.attr("transform", "translate(" + width / 2 + "," + (height-200) + ")");

var key = function(d){ return d.data.legend; };


var flag=1;


// pre set
change(dataset);

		
// pie deploy
function change(data) {
 if(flag%3===1){pie= d3.layout.pie()
	.sort(null)
	.startAngle(pi*-0.5)
    .endAngle(pi*0.5)
	.value(function(d) {
		return d.value;
	});

} else if(flag%3===2){pie= d3.layout.pie()
	.sort(null)
	.startAngle(pi*-0.5)
    .endAngle(pi*0.5)
	.value(function(d) {
		return d.values;
	});} 
	else if(flag%3===0){pie= d3.layout.pie()
	.sort(null)
	.startAngle(pi*-0.5)
    .endAngle(pi*0.5)
	.value(function(d) {
		return d.value3;
	});} 
	flag+=1;



	var slice = svg.select(".slices").selectAll("path.slice")
		.data(pie(data), key);

	slice.enter()
		.append("path") //=append()
			.attr("fill", function(d){ return d.data.color; })
		.attr("class", "slice")

		 .each(function(d){this.current=d;})
;

	slice		
		.transition().duration(800)
		.attrTween("d", function(d) {
	 	// this.current = this.current || d;
			var interpolate = d3.interpolate(this.current, d);
			this.current = interpolate(0);
			return function(t) {
				return arc(interpolate(t));
			}; 
		})

	slice.exit()
		.remove();


	var text = svg.select(".labels").selectAll("text")
		.data(pie(data), key);

	text.enter()
		.append("text")
		.attr("dy", "0.35em")
		.text(function(d) {return d.data.legend;
				})
	 .each(function(d){this.current=d;})
;
	// midAngle
	function midAngle(d){
		return d.startAngle + (d.endAngle - d.startAngle)/2;
	}

	text.transition().duration(800)
		
		.attrTween("transform", function(d) {
		//	this.current = this.current || d;
			var interpolate = d3.interpolate(this.current, d);
			this.current = interpolate(0);
			return function(t) {
				var d2 = interpolate(t);
				var pos = outerArc.centroid(d2);
				pos[0] = radius * (midAngle(d2) < 0 ? -1 : 1);//円周上にて右か左かを返す
				return "translate("+ pos +")"; // x軸上のトランスフォーム設定
			};
		})
		.styleTween("text-anchor", function(d){
		//	this.current = this.current || d;
			var interpolate = d3.interpolate(this.current, d);
			this.current = interpolate(0);
			return function(t) {
				var d2 = interpolate(t);
				return midAngle(d2) < 0 ? "end":"start"; //PI=180　右なら"text-anchor" =>"start"
			};
		});

	text.exit()
		.remove();


	var polyline = svg.select(".lines").selectAll("polyline")
		.data(pie(data), key);
	
	polyline.enter()
		.append("polyline")
	    .each(function(d){this.current=d;})
;

	polyline.transition().duration(800)
		.attrTween("points", function(d){
		//	this.current = this.current  ||d;
			var interpolate = d3.interpolate(this.current, d);
			this.current = interpolate(0);
			return function(t) {
				var d2 = interpolate(t);
				var pos = outerArc.centroid(d2);　　　　// outerArcの円周
				pos[0] = radius * 0.95 * (midAngle(d2) < 0 ? -1 : 1);
				return [arc.centroid(d2), outerArc.centroid(d2), pos];
			};			
		});
	
	polyline.exit()
		.remove();
};


	document.getElementById("btn").onclick=function(){
change(dataset);
}
</script>
</body>
